[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tablepilot"
version = "1.0.0"
description = "📊 Lightweight Tabular Data Intelligent Analysis Engine CLI - Zero dependencies, pure Python"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "TablePilot Team"}
]
keywords = ["data-analysis", "cli", "statistics", "visualization", "csv", "data-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.scripts]
tablepilot = "tablepilot.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/TablePilot"
Repository = "https://github.com/gitstq/TablePilot"
Issues = "https://github.com/gitstq/TablePilot/issues"

[tool.setuptools.packages.find]
include = ["tablepilot*"]

[tool.setuptools.package-data]
tablepilot = ["py.typed"]
